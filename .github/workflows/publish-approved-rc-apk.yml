name: Publish signed Android 0.9.0 RC APK

on:
  push:
    branches: [android-apk-0.9.0-rc]
    paths:
      - .github/workflows/publish-approved-rc-apk.yml

concurrency: highway-business-tycoon-0.9.0-rc-apk

jobs:
  publish:
    if: github.repository == 'kogonowski52-png/HighwayBusinessTycoon'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HBT_APK: HighwayBusinessTycoon-0.9.0-RC.apk
      HBT_APK_SIZE: '118345221'
      HBT_APK_DIGEST: 6ec6ff02c4fd725c959940d78452702af331874c910fa355e7193398e320ff67
      HBT_TAG: v0.9.0-rc.1
      HBT_SOURCE: 48c993c9af4d956b504c20f7f8bd494ef1a4c849
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 48c993c9af4d956b504c20f7f8bd494ef1a4c849
      - name: Download and verify the already signed APK
        shell: bash
        run: |
          apk="$RUNNER_TEMP/$HBT_APK"
          printf 'version https://git-lfs.github.com/spec/v1\noid sha256:%s\nsize %s\n' "$HBT_APK_DIGEST" "$HBT_APK_SIZE" |
            GIT_LFS_SKIP_SMUDGE=0 git lfs smudge "$HBT_APK" > "$apk"
          test "$(wc -c < "$apk")" = "$HBT_APK_SIZE"
          printf '%s  %s\n' "$HBT_APK_DIGEST" "$apk" | sha256sum -c
          unzip -tq "$apk"
      - name: Publish the test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/highway-business-tycoon-rc-notes.md"
          cat > "$notes" <<'NOTES'
          Podpisany APK testowy Highway Business Tycoon 0.9.0 RC na Android ARM64.

          - Pakiet `pl.krystiandevelopment.highwaytycoon`
          - Kod wersji `9000`
          - Stały certyfikat testowy używany w wersjach 0.7.0 i 0.8.0
          - SHA-256 pliku APK `6ec6ff02c4fd725c959940d78452702af331874c910fa355e7193398e320ff67`
          NOTES
          gh release create "$HBT_TAG" "$RUNNER_TEMP/$HBT_APK" \
            --repo "$GITHUB_REPOSITORY" --target "$HBT_SOURCE" \
            --title 'Highway Business Tycoon 0.9.0 RC · Android APK' \
            --notes-file "$notes" --prerelease --latest=false
