name: Publish signed Android 0.9.2 APK

on:
  push:
    branches: [android-apk-0.9.2-rc]
    paths:
      - .github/workflows/publish-approved-rc-apk.yml

concurrency: highway-business-tycoon-0.9.2-rc-apk

jobs:
  publish:
    if: github.repository == 'kogonowski52-png/HighwayBusinessTycoon'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HBT_APK: HighwayBusinessTycoon-0.9.2-test.apk
      HBT_APK_SIZE: '119942564'
      HBT_APK_DIGEST: 3803f62ff9e217c12d654f067783df3338d90f0414f9a7c90fdfffd2c8252b54
      HBT_TAG: v0.9.2-rc.1
      HBT_SOURCE: dad4e743fc771bebeb76e22a7c6c6ac2666af34c
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: dad4e743fc771bebeb76e22a7c6c6ac2666af34c
      - name: Download and verify the already signed APK
        shell: bash
        run: |
          apk="$RUNNER_TEMP/$HBT_APK"
          printf 'version https://git-lfs.github.com/spec/v1\noid sha256:%s\nsize %s\n' "$HBT_APK_DIGEST" "$HBT_APK_SIZE" |
            GIT_LFS_SKIP_SMUDGE=0 git lfs smudge "$HBT_APK" > "$apk"
          test "$(wc -c < "$apk")" = "$HBT_APK_SIZE"
          printf '%s  %s\n' "$HBT_APK_DIGEST" "$apk" | sha256sum -c
          unzip -tq "$apk"
      - name: Publish the test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/highway-business-tycoon-rc-notes.md"
          cat > "$notes" <<'NOTES'
          Podpisany APK testowy Highway Business Tycoon 0.9.2 na Android ARM64.

          - Pakiet `pl.krystiandevelopment.highwaytycoon`
          - Kod wersji `9002`
          - Stały certyfikat testowy zgodny z 0.9.1
          - Uruchamianie reklam po pierwszym dotknięciu, anulowanie oczekiwania i dziewięć sekcji sklepu.
          - Oficjalne reklamy testowe Google. Płatności wymagają ścieżki testowej Play i weryfikatora HTTPS.
          - SHA-256 pliku APK `3803f62ff9e217c12d654f067783df3338d90f0414f9a7c90fdfffd2c8252b54`
          NOTES
          gh release create "$HBT_TAG" "$RUNNER_TEMP/$HBT_APK" \
            --repo "$GITHUB_REPOSITORY" --target "$HBT_SOURCE" \
            --title 'Highway Business Tycoon 0.9.2 · Android APK' \
            --notes-file "$notes" --prerelease --latest=false
