name: Publish signed Android 0.9.3 APK

on:
  push:
    branches: [android-apk-0.9.3-rc]
    paths:
      - .github/workflows/publish-approved-rc-apk.yml

concurrency: highway-business-tycoon-0.9.3-rc-apk

jobs:
  publish:
    if: github.repository == 'kogonowski52-png/HighwayBusinessTycoon'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HBT_APK: HighwayBusinessTycoon-0.9.3-test.apk
      HBT_APK_SIZE: '126256615'
      HBT_APK_DIGEST: 4b15a73bdc4b4bd10648a44b15d2aa67b29cfdef3fde875cb13a6d24f7c67e8f
      HBT_TAG: v0.9.3-rc.1
      HBT_SOURCE: e0196cf06ef20a7905f994d8051197991e3f1693
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: e0196cf06ef20a7905f994d8051197991e3f1693
      - name: Download and verify the already signed APK
        shell: bash
        run: |
          apk="$RUNNER_TEMP/$HBT_APK"
          printf 'version https://git-lfs.github.com/spec/v1\noid sha256:%s\nsize %s\n' "$HBT_APK_DIGEST" "$HBT_APK_SIZE" |
            GIT_LFS_SKIP_SMUDGE=0 git lfs smudge "$HBT_APK" > "$apk"
          test "$(wc -c < "$apk")" = "$HBT_APK_SIZE"
          printf '%s  %s\n' "$HBT_APK_DIGEST" "$apk" | sha256sum -c
          unzip -tq "$apk"
      - name: Publish the test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/highway-business-tycoon-rc-notes.md"
          cat > "$notes" <<'NOTES'
          Podpisany APK testowy Highway Business Tycoon 0.9.3 na Android ARM64.

          - Pakiet `pl.krystiandevelopment.highwaytycoon`
          - Kod wersji `9003`
          - Stały certyfikat testowy zgodny z 0.9.2
          - Premium Graphics 2.0. Rozbudowana geometria sześciu lokalizacji, cztery częściowe wnętrza Północy i flota 30 modeli.
          - Oficjalne reklamy testowe Google. Płatności wymagają ścieżki testowej Play i weryfikatora HTTPS.
          - SHA-256 pliku APK `4b15a73bdc4b4bd10648a44b15d2aa67b29cfdef3fde875cb13a6d24f7c67e8f`
          NOTES
          gh release create "$HBT_TAG" "$RUNNER_TEMP/$HBT_APK" \
            --repo "$GITHUB_REPOSITORY" --target "$HBT_SOURCE" \
            --title 'Highway Business Tycoon 0.9.3 · Premium Graphics 2.0' \
            --notes-file "$notes" --prerelease --latest=false
