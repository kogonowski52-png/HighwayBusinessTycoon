name: Publish signed Android 0.9.4 APK

on:
  push:
    branches: [android-apk-0.9.4-rc]
    paths:
      - .github/workflows/publish-approved-rc-apk.yml

concurrency: highway-business-tycoon-0.9.4-rc-apk

jobs:
  publish:
    if: github.repository == 'kogonowski52-png/HighwayBusinessTycoon'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HBT_APK: HighwayBusinessTycoon-0.9.4-test.apk
      HBT_APK_SIZE: '155988497'
      HBT_APK_DIGEST: d1c0f4fcd09bf56e1afb6a9045ce434a49829a590cee8269fd82bc0e768957a1
      HBT_TAG: v0.9.4-rc.1
      HBT_SOURCE: d76e6a4f46321e40238e0bd5b497a872d0bbc4e1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: d76e6a4f46321e40238e0bd5b497a872d0bbc4e1
      - name: Download and verify the already signed APK
        shell: bash
        run: |
          apk="$RUNNER_TEMP/$HBT_APK"
          printf 'version https://git-lfs.github.com/spec/v1\noid sha256:%s\nsize %s\n' "$HBT_APK_DIGEST" "$HBT_APK_SIZE" |
            GIT_LFS_SKIP_SMUDGE=0 git lfs smudge "$HBT_APK" > "$apk"
          test "$(wc -c < "$apk")" = "$HBT_APK_SIZE"
          printf '%s  %s\n' "$HBT_APK_DIGEST" "$apk" | sha256sum -c
          unzip -tq "$apk"
      - name: Publish the test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/highway-business-tycoon-rc-notes.md"
          cat > "$notes" <<'NOTES'
          Podpisany APK testowy Highway Business Tycoon 0.9.4 na Android ARM64.

          - Pakiet `pl.krystiandevelopment.highwaytycoon`
          - Kod wersji `9004`
          - Stały certyfikat testowy zgodny z 0.9.3
          - World Expansion. Dwanaście grywalnych regionów, 84 biznesy, 48 modeli pojazdów i 33 menedżerów.
          - Oficjalne reklamy testowe Google. Płatności wymagają ścieżki testowej Play i weryfikatora HTTPS.
          - SHA-256 pliku APK `d1c0f4fcd09bf56e1afb6a9045ce434a49829a590cee8269fd82bc0e768957a1`

          [Galeria dwunastu lokalizacji](https://github.com/kogonowski52-png/HighwayBusinessTycoon/blob/v0.9.4-rc.1/screenshots/0.9.4/README.md) · [Raport testów i ograniczenia](https://github.com/kogonowski52-png/HighwayBusinessTycoon/blob/v0.9.4-rc.1/TEST_REPORT.md)
          NOTES
          movie="$RUNNER_TEMP/HighwayBusinessTycoon-0.9.4-rozgrywka.mp4"
          cp screenshots/0.9.4/rozgrywka.mp4 "$movie"
          gh release create "$HBT_TAG" "$RUNNER_TEMP/$HBT_APK" "$movie" \
            --repo "$GITHUB_REPOSITORY" --target "$HBT_SOURCE" \
            --title 'Highway Business Tycoon 0.9.4 · World Expansion' \
            --notes-file "$notes" --prerelease --latest=false
