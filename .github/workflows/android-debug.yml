name: Android debug release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

concurrency: android-debug-publication

jobs:
  publish-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GODOT_VERSION: '4.7.2'
      ANDROID_BUILD_TOOLS: '36.0.0'
      REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Resolve version and APK path
        shell: bash
        run: |
          tag="$REQUESTED_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'RELEASE_TAG=%s\nAPK=builds/HighwayBusinessTycoon-%s-debug.apk\n' "$tag" "${tag#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Load the persistent Android test signing identity
        shell: bash
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$TEST_KEYSTORE_BASE64" || -z "$TEST_KEYSTORE_PASSWORD" ]]; then
            echo '::error::Configure both persistent Android test signing secrets before publishing. See docs/ANDROID_SIGNING.md.'
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/hbt-signing"
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hbt-signing/test.p12"
          fingerprint=$("$JAVA_HOME_21_X64/bin/keytool" -exportcert -alias androiddebugkey \
            -keystore "$RUNNER_TEMP/hbt-signing/test.p12" -storepass:env TEST_KEYSTORE_PASSWORD \
            | sha256sum | cut -d ' ' -f 1)
          if [[ "$fingerprint" != "$(cat tools/android/test-certificate.sha256)" ]]; then
            echo '::error::Stored key does not match the enrolled test certificate.'
            exit 1
          fi

      - name: Prepare Godot and Android SDK
        shell: bash
        run: |
          godot_dir="$RUNNER_TEMP/hbt-godot"
          templates_dir="$godot_dir/editor_data/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$templates_dir"
          cd "$godot_dir"

          release_url="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable"
          editor="Godot_v$GODOT_VERSION-stable_linux.x86_64"
          templates="Godot_v$GODOT_VERSION-stable_export_templates.tpz"
          curl --fail --silent --show-error --location --retry 3 --output "$editor.zip" "$release_url/$editor.zip"
          curl --fail --silent --show-error --location --retry 3 --output "$templates" "$release_url/$templates"
          sha512sum -c <<'CHECKSUMS'
          9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  Godot_v4.7.2-stable_linux.x86_64.zip
          ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  Godot_v4.7.2-stable_export_templates.tpz
          CHECKSUMS
          unzip -q "$editor.zip"
          mv "$editor" godot
          unzip -qj "$templates" 'templates/android_debug.apk' -d "$templates_dir"
          if [[ -f "$GITHUB_WORKSPACE/tools/android/build-monetization.sh" ]]; then
            unzip -qj "$templates" 'templates/android_source.zip' -d "$templates_dir"
            gradle_zip="$RUNNER_TEMP/gradle-8.13-bin.zip"
            curl --fail --silent --show-error --location --retry 3 \
              https://downloads.gradle.org/distributions/gradle-8.13-bin.zip -o "$gradle_zip"
            printf '%s  %s\n' 20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78 "$gradle_zip" | sha256sum -c -
            unzip -q "$gradle_zip" -d "$RUNNER_TEMP"
            printf '%s\n' "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
            printf 'HBT_ANDROID_TEMPLATE=%s\n' "$templates_dir/android_source.zip" >> "$GITHUB_ENV"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0"
          fi
          touch _sc_

          if [[ ! -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$ANDROID_BUILD_TOOLS"
          fi

          cat > "$godot_dir/editor_data/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_21_X64"
          SETTINGS
          printf '%s\n' "$godot_dir" >> "$GITHUB_PATH"

      - name: Build and verify APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/hbt-signing/test.p12"
          export ANDROID_BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          if [[ -f tools/android/build-monetization.sh ]]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"
            tools/android/build-monetization.sh test "$PWD/$APK"
            HBT_RELEASE_VERSION="${RELEASE_TAG#v}" tools/android/verify-monetization-apk.sh "$APK"
          else
            godot --headless --editor --import --path . --quit
            godot --headless --path . --export-debug Android "$APK"
            tools/android/verify-test-apk.sh "$APK" "${RELEASE_TAG#v}"
          fi

      - name: Remove the runner key copy
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/hbt-signing/test.p12"

      - name: Store verified APK as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: HighwayBusinessTycoon-${{ env.RELEASE_TAG }}-Android
          path: ${{ env.APK }}
          if-no-files-found: error
          compression-level: 0

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          released_tags=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName --jq '.[].tagName')
          latest=$(printf '%s\n%s\n' "$RELEASE_TAG" "$released_tags" | sed -n '/^v[0-9]\+\.[0-9]\+\.[0-9]\+$/p' | sort -V | tail -1)
          if [[ "$latest" != "$RELEASE_TAG" ]]; then
            echo '::error::A newer test release already exists.'
            exit 1
          fi
          checksum=$(sha256sum "$APK" | cut -d ' ' -f 1)
          architectures=$("$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^native-code: //p" | tr -d "'")
          notes="Testowy APK Android ($architectures). Gra działa offline. SHA-256: $checksum"
          publish_release() {
            local release
            if ! release=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft); then
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
                --title "Highway Business Tycoon ${RELEASE_TAG#v} · Android debug" --notes "$notes" || return 1
              release='{"assets":[],"isDraft":true}'
            fi
            if ! jq -e --arg name "${APK##*/}" '.assets | any(.name == $name and .size > 0)' <<< "$release" >/dev/null; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes" >/dev/null || return 1
              gh release upload "$RELEASE_TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber || return 1
            fi
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false >/dev/null || return 1
            fi
          }
          for attempt in 1 2 3; do
            if publish_release; then exit 0; fi
            printf 'Publish attempt %s failed\n' "$attempt" >&2
            if [[ "$attempt" != 3 ]]; then sleep "$((attempt * 5))"; fi
          done
          exit 1
