plugins {
    id 'com.android.library' version '8.11.1'
}

android {
    namespace 'pl.krystiandevelopment.highwaytycoon.ads'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.2.stable'
    compileOnly 'com.google.android.gms:play-services-ads:24.8.0'
    compileOnly 'com.google.android.ump:user-messaging-platform:3.2.0'
}
