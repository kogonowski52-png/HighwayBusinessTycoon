plugins {
    id 'com.android.library' version '8.11.1'
}

android {
    namespace 'pl.krystiandevelopment.highwaytycoon.ads'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.2.stable'
    compileOnly 'com.google.android.gms:play-services-ads:25.5.0'
    compileOnly 'com.google.android.ump:user-messaging-platform:4.0.0'
    compileOnly "com.android.billingclient:billing:9.1.0"
    compileOnly "androidx.credentials:credentials:1.6.0"
    compileOnly "com.google.android.libraries.identity.googleid:googleid:1.2.1"
}
